name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # Pinned: ubuntu-latest moves to a new major version on 2026-10-19.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # build runs lint and tests first (prebuild), as on Render.
      - run: npm run build
      - run: npx tsc --noEmit

      - name: Migrations apply and are idempotent
        run: |
          # Supabase roles, so the access revocation is exercised too.
          psql "$DATABASE_URL" -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          npm run db:migrate
          npm run db:migrate | grep -q "up to date"
      - name: Journal is append-only and closed to public roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO change_log (entity, entity_id, action, actor) VALUES ('ci', 'x', 'created', 'ci')"
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE change_log SET reason = 'x'"
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM change_log"
          test "$(psql "$DATABASE_URL" -tA -c "SELECT jsonb_typeof(tables->'change_log') FROM editorial_snapshots WHERE id = take_editorial_snapshot('ci')")" = array
          test "$(psql "$DATABASE_URL" -tA -c "SELECT has_table_privilege('anon', 'change_log', 'SELECT')")" = f
          test "$(psql "$DATABASE_URL" -tA -c "SELECT count(*) FROM pg_tables t WHERE schemaname = 'public'
            AND (NOT rowsecurity OR NOT EXISTS (SELECT 1 FROM pg_policies p WHERE p.tablename = t.tablename))")" = 0
      - name: Source imports load once and stay immutable
        run: |
          npm run db:import
          npm run db:import | grep -q "already loaded"
          Q="SET search_path TO public, extensions;"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'quran.ar.hafs'")" = 6348
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'quran.ar.hafs-simple'")" = 6348
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE level = 'ayah'")" = 6236
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q UPDATE texts SET content = 'x' WHERE address = 'quran.1.1'"
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q DELETE FROM addresses WHERE address = 'quran.1.1'"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'bukhari.ar.tawq-najat'")" = 7401
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM work_sections WHERE version_id = 'bukhari.ar.tawq-najat' AND kind = 'book'")" = 97
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q UPDATE texts SET content = 'x' WHERE address = 'bukhari.1'"
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q UPDATE work_sections SET title = 'x' WHERE version_id = 'bukhari.ar.tawq-najat'"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'muslim.ar.ihya-turath'")" = 7460
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'muslim' AND level = 'hadith'")" = 3027
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM work_sections WHERE version_id = 'muslim.ar.ihya-turath' AND kind = 'book'")" = 55
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q UPDATE section_items SET book = 1 WHERE address = 'muslim.8.1'"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'abu_dawud.ar.abd-al-hamid'")" = 5274
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tirmidhi.ar.shakir'")" = 3976
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'nasai.ar.abu-ghudda'")" = 5769
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'ibn_majah.ar.abd-al-baqi'")" = 4341
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'kafi.ar.ghaffari'")" = 15197
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'ahmad.ar.arnaut'")" = 27697
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'kafi' AND level = 'chapter'")" = 2319
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM hadith_links WHERE method = 'similar-texts:v1'")" = 49053
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q UPDATE hadith_links SET share = 1"
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q TRUNCATE hadith_link_reviews"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'ibn_hisham.ar.saqqa'")" = 3302
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'ibn_hisham' AND level = 'page'")" = 1385
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM work_sections WHERE version_id = 'ibn_hisham.ar.saqqa' AND kind = 'book'")" = 264
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tafsir_ibn_kathir.ar.salama'")" = 2062
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(DISTINCT ayah) FROM commentary_ayahs WHERE comment <@ 'tafsir_ibn_kathir'")" = 6228
          ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$Q TRUNCATE commentary_ayahs"
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'masahif_ibn_abi_dawud.ar.abduh'")" = 818
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'fadail_abu_ubayd.ar.jk'")" = 760
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'sabaa_ibn_mujahid.ar.dayf'")" = 638
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'ansab_baladhuri.ar.zakkar'")" = 5990
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'ansab_baladhuri' AND level = 'page'")" = 5447
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'sabaa_ibn_mujahid' AND level = 'page'")" = 595
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'maghazi_waqidi.ar.jones'")" = 1226
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'maghazi_waqidi' AND level = 'page'")" = 1125
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tarikh_khalifa.ar.umari'")" = 1274
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'tarikh_khalifa' AND level = 'page'")" = 433
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tarikh_tabari.ar.turath'")" = 7688
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM addresses WHERE work_id = 'tarikh_tabari' AND level = 'page'")" = 5822
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tanakh.he.wlc'")" = 23206
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'tanakh.ru.synodal'")" = 22724
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'nt.grc.sblgnt'")" = 7939
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'nt.ru.synodal'")" = 7937
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM texts WHERE version_id = 'mishnah.he.vilna'")" = 4187
          test "$(psql "$DATABASE_URL" -tAq -c "$Q SELECT count(*) FROM works WHERE canon = 'external'")" = 3
