name: Keep awake

# The free plan of Render puts the site to sleep after 15 minutes without
# visitors, and the next visitor waits up to a minute. This job opens the
# health address every 5 minutes during the day, so the site stays awake, and
# fails (GitHub then writes to the owner) if the site does not answer.
#
# Only from 07:00 to 24:00 Tashkent time (02:00-18:59 UTC): Render gives 750
# free hours a month for the whole workspace and suspends every free service
# when they run out, so the site may not be kept awake around the clock.
# The address does not read the database, so the database may still sleep.
on:
  schedule:
    - cron: "*/5 2-18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the health address
        run: |
          # A sleeping site needs up to a minute to wake: three tries.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://manba-c7zo.onrender.com/api/health || true)
            echo "attempt $attempt: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "The site does not answer." >&2
          exit 1
